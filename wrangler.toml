# This is the Pages project name, so it is also the hostname: lintang-wengi.pages.dev.
# Changing it after the first deploy creates a second project rather than renaming
# the first, so it has to be right before that deploy, not after.
name = "lintang-wengi"
pages_build_output_dir = "dist"

# Pinning this keeps the Workers runtime behaviour identical between local
# `wrangler pages dev` and production. Without it wrangler silently uses today's
# date, so a deploy months from now could land on different runtime semantics
# than the one that was tested.
compatibility_date = "2026-08-05"
